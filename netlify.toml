# Static site. The build copies the website into dist/ and turns js/data.js into
# content.json for the iOS app. Nothing outside the website (ios/, scripts/) gets published.
[build]
  publish = "dist"
  command = "node scripts/build.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Always revalidate so a deploy shows up on the next visit (the files are tiny).
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
